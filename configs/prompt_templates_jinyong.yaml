categories:
  - name: "人物对白"
    templates:
      - id: "dialogue_rivals_01"
        instruction_template: "以金庸武侠小说风格写一段人物对白。"
        input_template: "人物：{hero} 与 {rival}；地点：{location}；冲突：{conflict}。"
        usage_notes: "突出机锋、身份差异与江湖礼法。"
      - id: "dialogue_master_disciple_01"
        instruction_template: "以金庸武侠小说风格写一段人物对白。"
        input_template: "人物：师父 {master} 与弟子 {disciple}；背景：{background}；主题：{theme}。"
        usage_notes: "适合写传功、逐出师门、旧情难断。"
  - name: "江湖旁白"
    templates:
      - id: "narration_faction_conflict_01"
        instruction_template: "以金庸武侠小说风格写一段江湖旁白。"
        input_template: "地点：{location}；两派：{faction_a} 与 {faction_b}；局势：{situation}。"
        usage_notes: "适合开场交代恩怨与势力关系。"
  - name: "章节开篇"
    templates:
      - id: "chapter_opening_weather_01"
        instruction_template: "以金庸武侠小说风格写一段章节开篇。"
        input_template: "时辰：{time_of_day}；天气：{weather}；地点：{location}；伏笔：{foreshadowing}。"
        usage_notes: "强调景入情、静中见险。"
  - name: "打斗场面"
    templates:
      - id: "battle_duel_01"
        instruction_template: "以金庸武侠小说风格写一段打斗场面。"
        input_template: "对阵：{fighter_a} 对 {fighter_b}；兵器：{weapon_a} 与 {weapon_b}；场景：{location}。"
        usage_notes: "招式名称与内力碰撞并重。"
      - id: "battle_group_01"
        instruction_template: "以金庸武侠小说风格写一段群战场面。"
        input_template: "主角：{hero}；敌方人数：{enemy_count}；地形：{terrain}；转折：{turning_point}。"
        usage_notes: "突出节奏变化与危机化解。"
  - name: "诗词偈语"
    templates:
      - id: "poetry_transition_01"
        instruction_template: "以金庸武侠小说风格写一段诗词偈语并衔接叙事。"
        input_template: "主题：{theme}；人物：{character}；处境：{situation}。"
        usage_notes: "先诗后叙，诗句不宜过长。"
